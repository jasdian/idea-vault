[package]
name = "idea-vault"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "Localhost web tool for solo ideation: run an idea into the ground with a local AI, then store it in the vault"
license = "MIT"

[dependencies]
# web
axum = "0.8"
tokio = { version = "1.52", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# inbound MCP server (ADR-0024): the official Rust MCP SDK, Streamable HTTP transport.
# Pin "1" (1.8.x) — "0.1" is a pre-1.0 line with a different API.
rmcp = { version = "1", features = ["server", "macros", "transport-streamable-http-server"] }
# http::request::Parts — rmcp's RequestContext carries the inbound Parts; a direct dep unifies
# the http version (see mcp-server's Cargo.toml for the same rationale).
http = "1"

# templates — askama_axum is deprecated; askama_web is the maintained axum bridge
askama = "0.16"
askama_web = { version = "0.16", features = ["axum-0.8"] }

# storage (bundled SQLite: no system libsqlite3, ships FTS5 — ADR-0002 / docs/12)
rusqlite = { version = "0.37", features = ["bundled"] }
walkdir = "2.5"

# ai / http client — rustls, no OpenSSL (docs/12, ADR-0008)
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }

# serde stack (serde_norway = maintained serde_yaml fork; frontmatter per D8)
serde = { version = "1.0", features = ["derive"] }
serde_norway = "0.9"
serde_json = "1.0"
serde_urlencoded = "0.7"
chrono = { version = "0.4", features = ["serde"] }

# markdown render + sanitize (wired in later milestones)
pulldown-cmark = "0.13"
ammonia = "4"

# streams (SSE plumbing, D11)
futures = "0.3"
tokio-stream = "0.1"
bytes = "1"

# assets (single-binary: htmx/CSS embedded — ADR-0001, docs/12)
rust-embed = "8"

# MCP replay args hash (docs/adr/0033); also used by tests
sha2 = "0.10"

# errors
thiserror = "2"
anyhow = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

# Compiler-enforced handbook rules (ADR-0041 catalog amendment). Test code is exempt from the
# unwrap/print denials through clippy.toml; main.rs opts into printing with a local #[expect].
[lints.rust]
# RU-001/SE-006: unsafe only with a local #[expect(unsafe_code, reason)] and a // SAFETY: comment
# above each block; deny rather than forbid so a justified site can opt in. Counted by the unsafe
# ratchet in scripts/check-invariants.sh.
unsafe_code = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
# HTC-6, CQ-005: Result over panic; expect("<reason>") stays for a proven invariant.
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"
# HTC-8, OB-001: log through tracing, never stdout/stderr, outside main.rs.
print_stdout = "deny"
print_stderr = "deny"
